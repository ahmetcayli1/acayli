services:
  db:
    image: pgvector/pgvector:pg16
    container_name: uniwise_db
    environment:
      POSTGRES_USER: uniwise
      POSTGRES_PASSWORD: uniwise
      POSTGRES_DB: uniwise
    ports:
      - "5432:5432"
    volumes:
      - uniwise_db_data:/var/lib/postgresql/data

volumes:
  uniwise_db_data:

